<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Orbit responsive verification</title><style>body{margin:0;background:#e9eaf0;color:#202144;font:14px/1.5 Arial}aside{position:fixed;left:20px;top:20px;width:280px;background:white;padding:20px;border-radius:16px}label{display:block;margin:12px 0}select,button{font:inherit;padding:10px;width:100%;margin-top:5px}pre{white-space:pre-wrap;font-size:12px}iframe{display:block;margin:20px 0 30px 340px;border:0;background:#f6f3ec;box-shadow:0 10px 50px #20214420;border-radius:10px}button{cursor:pointer}</style></head><body><aside><h1 style="font-size:20px">Responsive verification</h1><label>Page<select id="page"><option value="index">Home</option><option value="about">Our story</option><option value="circles">Circles</option><option value="learn">Learn</option><option value="projects">Build</option><option value="meetups">Meetups</option><option value="join">Join</option></select></label><label>Viewport<select id="size"><option value="390,844">390 × 844 mobile</option><option value="320,740">320 × 740 narrow mobile</option><option value="680,900">680 × 900 large mobile</option><option value="768,1024">768 × 1024 tablet</option><option value="1024,768">1024 × 768 laptop</option><option value="1600,1000">1600 × 1000 wide desktop</option><option value="740,390">740 × 390 landscape</option></select></label><button id="audit">Audit current page</button><button id="all">Audit all pages and sizes</button><pre id="result" role="status">Loading…</pre><a href="index.html">Open the website ↗</a></aside><iframe id="preview" title="Responsive website preview" width="390" height="844" src="index.html"></iframe><script>
const frame=document.querySelector('iframe'),page=document.querySelector('#page'),size=document.querySelector('#size'),result=document.querySelector('#result');
function resize(){const [w,h]=size.value.split(',');frame.width=w;frame.height=h;}function load(){frame.src=page.value+'.html';}size.onchange=()=>{resize();result.textContent='Viewport updated. Ready to audit.'};page.onchange=load;
function audit(){const d=frame.contentDocument;const images=[...d.images];return {page:d.body.dataset.page,viewport:frame.contentWindow.innerWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,h1:d.querySelectorAll('h1').length,brokenImages:images.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),menuVisible:frame.contentWindow.getComputedStyle(d.querySelector('.menu-toggle')).display!=='none',navVisible:frame.contentWindow.getComputedStyle(d.querySelector('#main-navigation')).display!=='none'};}
frame.onload=()=>{result.textContent=JSON.stringify(audit(),null,2)};document.querySelector('#audit').onclick=()=>{result.textContent=JSON.stringify(audit(),null,2)};
document.querySelector('#all').onclick=async()=>{const report=[];for(const p of [...page.options]){for(const s of [...size.options]){page.value=p.value;size.value=s.value;resize();await new Promise(resolve=>{frame.onload=resolve;load();});await frame.contentDocument.fonts.ready;await new Promise(resolve=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(resolve)));for(const image of frame.contentDocument.images)image.loading='eager';await Promise.all([...frame.contentDocument.images].map(async image=>{try{await image.decode();}catch{}}));report.push(audit());result.textContent='Checked '+report.length+' combinations…';}}const failures=report.filter(x=>x.overflow||x.h1!==1||x.brokenImages.length);result.textContent=JSON.stringify({checked:report.length,failures},null,2);page.value='index';size.value='390,844';resize();frame.onload=null;load();};
</script></body></html>
