<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 — Lost in orbit · Tech Orbit</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f4b63c'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='17'%20fill='none'%20stroke='%2314131a'%20stroke-width='5'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='10'%20fill='%237a4dff'/%3E%3C/svg%3E">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;background:#f6efe2;color:#14131a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:20px;overflow:hidden}
@media(prefers-color-scheme:dark){body{background:#14131a;color:#f6efe2}}
.wrap{max-width:520px}
.astro{font-size:110px;display:inline-block;animation:flo 3.2s ease-in-out infinite}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.astro{animation:none}}
h1{font-size:clamp(2rem,8vw,3.2rem);margin:.4em 0}
p{color:#5d5a66;line-height:1.6;margin-bottom:1.6em}
@media(prefers-color-scheme:dark){p{color:#aaa7b5}}
a.bt{display:inline-block;background:linear-gradient(90deg,#2f6bff,#7a4dff);color:#fff;text-decoration:none;font-weight:800;padding:14px 30px;border-radius:14px;box-shadow:5px 5px 0 #14131a;border:3px solid #14131a}
.star{position:fixed;background:#14131a;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:.5;animation:tw 2.4s ease-in-out infinite}
@media(prefers-color-scheme:dark){.star{background:#f6efe2}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.8}}
</style>
</head>
<body>
<i class="star" style="left:12%;top:18%;width:18px;height:18px"></i>
<i class="star" style="right:16%;top:24%;width:14px;height:14px;animation-delay:.7s"></i>
<i class="star" style="left:22%;bottom:20%;width:14px;height:14px;animation-delay:1.2s"></i>
<i class="star" style="right:12%;bottom:26%;width:18px;height:18px;animation-delay:.4s"></i>
<div class="wrap">
<span class="astro">🧑‍🚀</span>
<h1>404 — this page drifted out of orbit</h1>
<p>Even astronauts take a wrong turn sometimes. Let's get you back to the mothership.</p>
<a class="bt" id="home404" href="/">🚀 Back to Tech Orbit</a>
</div>
<script>try{var m=location.pathname.match(/^\/[^/]+\//);document.getElementById("home404").href=(m?m[0]:"/")}catch(e){}</script>
</body>
</html>
